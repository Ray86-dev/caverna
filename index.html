<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0b16">
<title>Sal de la caverna</title>
<style>
:root{--bg:#0e0b16;--panel:#1d1829;--panel2:#2a2339;--ink:#f6f1e7;--dim:#a79fb8;--torch:#ffb347;--sun:#ffd95a;--ok:#3ddc84;--bad:#ff5468;--c0:#e84a5f;--c1:#3d8bfd;--c2:#f5a524;--c3:#2bb673;--tc:#555}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  background-image:radial-gradient(ellipse 90% 40% at 80% -5%,rgba(255,217,90,.16),transparent 70%)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#hd{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:3px solid var(--tc);flex:none}
#hd.on{display:flex}
#hd .e{font-size:26px}
#hd .w{flex:1;min-width:0}
#hd .n{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .t{font-size:12px;color:var(--dim)}
#hd .p{font-weight:900;font-size:18px;color:var(--sun);font-variant-numeric:tabular-nums}
#tb{height:6px;background:var(--panel2);flex:none;visibility:hidden}
#tb i{display:block;height:100%;background:linear-gradient(90deg,var(--torch),var(--sun));transform-origin:left;width:100%}
#m{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;max-width:560px;width:100%;margin:0 auto;min-height:0;overflow-y:auto}
.c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
h1{font-size:34px;font-weight:900;line-height:1.05;background:linear-gradient(180deg,#fff3c4,#ffb347 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;line-height:1.2}
p{color:var(--dim);font-size:16px;line-height:1.4}
.xl{font-size:72px;line-height:1}
input{font:inherit;font-size:22px;padding:14px;border-radius:14px;border:0;width:100%;text-align:center;background:#fff;color:#111;user-select:text;-webkit-user-select:text}
input.code{text-transform:uppercase;letter-spacing:8px;font-weight:900;font-size:30px}
.go{background:linear-gradient(180deg,#ffc45e,#ff9838);color:#2a1500;font-weight:800;font-size:20px;padding:15px;border-radius:14px;width:100%;box-shadow:0 4px 0 #b55f10}
.go:active,.o:active,.nm:active{transform:translateY(3px);filter:brightness(1.15)}
.lnk{color:var(--dim);font-size:14px;text-decoration:underline;padding:8px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.nm{background:var(--panel2);border-radius:12px;padding:14px 8px;font-size:18px;font-weight:700}
.q{font-size:18px;font-weight:700;line-height:1.3;background:var(--panel);border-radius:14px;padding:12px 14px}
.os{flex:1;display:grid;gap:10px;grid-template-columns:1fr;align-content:stretch;min-height:0}
.os.two{grid-template-columns:1fr 1fr}
.o{background:var(--oc);border-radius:16px;padding:12px 14px;font-size:17px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.o .s{font-size:22px;width:26px;text-align:center;flex:none}
.os.two .o{flex-direction:column;justify-content:center;text-align:center;font-size:22px}
.os.two .o .s{font-size:48px;width:auto}
.res{border-radius:18px;padding:22px 16px;width:100%;font-weight:800}
.res.ok{background:#12492d;border:2px solid var(--ok)}
.res.ko{background:#4a1722;border:2px solid var(--bad)}
.res.nu{background:var(--panel);border:2px solid var(--panel2)}
.res .b{font-size:44px;line-height:1.1}
.res small{display:block;font-weight:500;color:var(--ink);opacity:.85;font-size:15px;margin-top:8px;line-height:1.35}
.clue{background:var(--panel);border-radius:12px 12px 12px 2px;padding:9px 12px;font-size:15px;line-height:1.3;text-align:left;width:100%}
.clue b{color:var(--torch);margin-right:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;width:100%}
.grid .nm{font-size:14px;padding:12px 2px}
.nm.sel{background:var(--torch);color:#2a1500}
.sc{width:100%;display:flex;flex-direction:column;gap:7px}
.sc div{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:800;font-size:17px;border-left:6px solid var(--tc)}
.sc div.me{background:var(--panel2);outline:2px solid var(--sun)}
.sc span{flex:1;text-align:left}
.tb{width:100%;text-align:left;font-size:15px;font-weight:700}
.tb .bg{height:14px;background:var(--panel2);border-radius:10px;overflow:hidden;margin-top:4px}
.tb .bg i{display:block;height:100%;border-radius:10px;background:var(--ok)}
.tb .bg i.mid{background:var(--c2)}.tb .bg i.low{background:var(--bad)}
.tip{background:var(--panel);border-left:5px solid var(--sun);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;text-align:left;width:100%}
.orc{background:linear-gradient(180deg,#6d5bd0,#4a3aa8);border-radius:18px;padding:20px;font-size:20px;font-weight:800;width:100%;animation:pu .6s infinite alternate}
@keyframes pu{to{transform:scale(1.04)}}
#net{position:fixed;left:0;right:0;bottom:0;background:var(--bad);color:#fff;text-align:center;font-size:13px;padding:5px;display:none;font-weight:700}
</style>
</head>
<body>
<div id="hd"><div class="e" id="he"></div><div class="w"><div class="n" id="hn"></div><div class="t" id="ht"></div></div><div class="p" id="hp"></div></div>
<div id="tb"><i></i></div>
<div id="m"></div>
<div id="net">Reconectando…</div>
<script src="vendor/supabase.js"></script>
<script src="js/net.js?v=3"></script>
<script src="js/play.js?v=3"></script>
</body>
</html>
